<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendants - SmartPark Pro</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    
    <!-- Dynamic Topbar Navigation Container -->
    <div id="topbar-container"></div>

    <div class="container-fluid p-4">
      <div class="glass-panel p-4">
        
        <!-- Header Controls -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h5 class="fw-bold mb-1">Parking Attendants Directory</h5>
            <p class="text-secondary small mb-0">Admin control panel to manage operator user profiles, access states, and login accounts.</p>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#attendantModal" onclick="openAddAttendantModal()">
            <i class="fas fa-user-plus me-2"></i>Register Operator
          </button>
        </div>

        <!-- Table Row -->
        <div class="table-responsive">
          <div id="attendants-table-loader"></div>
          <table class="custom-table" id="attendants-table">
            <thead>
              <tr>
                <th>Operator Name</th>
                <th>Username</th>
                <th>Contact Details</th>
                <th>Hire Date</th>
                <th>Account Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="attendants-table-body">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <!-- Attendant CRUD Modal -->
  <div class="modal fade" id="attendantModal" tabindex="-1" aria-labelledby="attendantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-panel text-white" style="border: 1px solid var(--border-color); background-color: var(--bg-secondary);">
        <div class="modal-header border-bottom border-secondary border-opacity-15">
          <h5 class="modal-title fw-bold" id="attendantModalLabel">Configure Operator</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="attendant-crud-form">
          <input type="hidden" id="modal-attendant-id">
          <div class="modal-body row g-3 text-start">
            
            <!-- Standard credentials fields -->
            <div class="col-12 pb-2 border-bottom border-secondary border-opacity-10 mb-2">
              <h6 class="fw-bold text-info"><i class="fas fa-lock me-1"></i>Login Credentials</h6>
            </div>

            <div class="col-md-6" id="credential-username-container">
              <label for="modal-username" class="form-label">Login Username <span class="text-danger">*</span></label>
              <input type="text" id="modal-username" class="form-control" placeholder="e.g. rahul_ops" required>
            </div>

            <div class="col-md-6" id="credential-password-container">
              <label for="modal-password" class="form-label">Password <span class="text-danger" id="passRequiredStar">*</span></label>
              <input type="password" id="modal-password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>

            <div class="col-12">
              <label for="modal-email" class="form-label">Access Email Address <span class="text-danger">*</span></label>
              <input type="email" id="modal-email" class="form-control" placeholder="e.g. rahul@smartparking.com" required>
            </div>

            <!-- Profile bio fields -->
            <div class="col-12 pb-2 border-bottom border-secondary border-opacity-10 my-2">
              <h6 class="fw-bold text-info"><i class="fas fa-user-circle me-1"></i>Operator Bio Profile</h6>
            </div>

            <div class="col-md-6">
              <label for="modal-name" class="form-label">Full Employee Name <span class="text-danger">*</span></label>
              <input type="text" id="modal-name" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="col-md-6">
              <label for="modal-phone" class="form-label">Employee Phone <span class="text-danger">*</span></label>
              <input type="text" id="modal-phone" class="form-control" placeholder="e.g. +91 9999988888" required>
            </div>

            <div class="col-md-6">
              <label for="modal-hire-date" class="form-label">Hire Date</label>
              <input type="date" id="modal-hire-date" class="form-control">
            </div>

            <div class="col-md-6">
              <label for="modal-status" class="form-label">Account Status</label>
              <select id="modal-status" class="form-select">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div class="col-12">
              <label for="modal-address" class="form-label">Home Address</label>
              <textarea id="modal-address" class="form-control" rows="2" placeholder="Street, City, State details..."></textarea>
            </div>

          </div>
          <div class="modal-footer border-top border-secondary border-opacity-15">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Operator Card</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Application Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    let allAttendants = [];

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        loadAttendantsData();
      }, 400);
    });

    async function loadAttendantsData() {
      const loader = document.getElementById('attendants-table-loader');
      showLoader(loader);

      try {
        const response = await apiRequest('/attendants');
        if (response.success) {
          allAttendants = response.data;
          renderAttendantsTable();
        }
      } catch (err) {
        console.error(err);
        showToast('Connection error fetching attendants profiles.', 'error');
      } finally {
        loader.innerHTML = '';
      }
    }

    function renderAttendantsTable() {
      const body = document.getElementById('attendants-table-body');
      body.innerHTML = '';

      if (allAttendants.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-4">No parking attendants registered.</td></tr>';
        return;
      }

      allAttendants.forEach(a => {
        const hire = new Date(a.hire_date).toLocaleDateString();
        
        let statusBadge = a.status === 'Active' 
          ? '<span class="badge-status badge-available">Active</span>' 
          : '<span class="badge-status badge-maintenance">Inactive</span>';

        body.innerHTML += `
          <tr>
            <td class="fw-bold text-white">${a.name}</td>
            <td><code>${a.username}</code></td>
            <td>
              <div class="small text-white">${a.email}</div>
              <div class="small text-secondary">${a.phone}</div>
            </td>
            <td>${hire}</td>
            <td>${statusBadge}</td>
            <td class="text-end">
              <button onclick="openEditAttendantModal(${a.id})" class="btn btn-secondary btn-sm me-1" data-bs-toggle="modal" data-bs-target="#attendantModal" title="Edit Profile"><i class="fas fa-edit text-info"></i></button>
              <button onclick="deleteAttendant(${a.id})" class="btn btn-secondary btn-sm" title="Revoke access account"><i class="fas fa-trash-alt text-danger"></i></button>
            </td>
          </tr>
        `;
      });
    }

    // Modal triggers
    function openAddAttendantModal() {
      document.getElementById('attendantModalLabel').innerText = 'Register New Operator';
      document.getElementById('attendant-crud-form').reset();
      document.getElementById('modal-attendant-id').value = '';
      
      // Username field visible and required
      document.getElementById('credential-username-container').classList.remove('d-none');
      document.getElementById('modal-username').required = true;
      
      // Password field required
      document.getElementById('passRequiredStar').classList.remove('d-none');
      document.getElementById('modal-password').required = true;
      document.getElementById('modal-password').placeholder = "Minimum 6 characters";
      
      // Current date default for hire
      document.getElementById('modal-hire-date').value = new Date().toISOString().slice(0, 10);
    }

    function openEditAttendantModal(id) {
      document.getElementById('attendantModalLabel').innerText = 'Configure Operator Account';
      const a = allAttendants.find(item => item.id === id);
      if (!a) return;

      document.getElementById('modal-attendant-id').value = a.id;
      document.getElementById('modal-email').value = a.email;
      document.getElementById('modal-name').value = a.name;
      document.getElementById('modal-phone').value = a.phone;
      document.getElementById('modal-status').value = a.status;
      document.getElementById('modal-address').value = a.address || '';
      
      const rawDate = new Date(a.hire_date).toISOString().slice(0, 10);
      document.getElementById('modal-hire-date').value = rawDate;

      // Username locked during profile update
      document.getElementById('credential-username-container').classList.add('d-none');
      document.getElementById('modal-username').required = false;

      // Password optional during profile update
      document.getElementById('passRequiredStar').classList.add('d-none');
      document.getElementById('modal-password').required = false;
      document.getElementById('modal-password').placeholder = "Leave blank to keep unchanged";
      document.getElementById('modal-password').value = '';
    }

    // Submit CRUD Form
    document.getElementById('attendant-crud-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('modal-attendant-id').value;
      const username = document.getElementById('modal-username').value;
      const password = document.getElementById('modal-password').value;
      const email = document.getElementById('modal-email').value;
      const name = document.getElementById('modal-name').value;
      const phone = document.getElementById('modal-phone').value;
      const hire_date = document.getElementById('modal-hire-date').value;
      const status = document.getElementById('modal-status').value;
      const address = document.getElementById('modal-address').value;

      const body = { email, name, phone, hire_date, status, address };

      if (id) {
        // Edit flow
        if (password && password.trim() !== '') {
          body.password = password;
        }
      } else {
        // Add flow
        body.username = username;
        body.password = password;
      }

      try {
        let response;
        if (id) {
          response = await apiRequest(`/attendants/${id}`, 'PUT', body);
        } else {
          response = await apiRequest('/attendants', 'POST', body);
        }

        if (response.success) {
          showToast(response.message || 'Operator account saved!', 'success');
          
          const modalInstance = bootstrap.Modal.getInstance(document.getElementById('attendantModal'));
          modalInstance.hide();
          
          loadAttendantsData();
        } else {
          throw new Error(response.message || 'Save failed');
        }
      } catch (err) {
        console.error(err);
        showToast(err.message || 'API rejected operator changes.', 'error');
      }
    });

    // Delete Operator
    async function deleteAttendant(id) {
      const a = allAttendants.find(item => item.id === id);
      if (!a) return;

      if (confirm(`CRITICAL: Revoking attendant "${a.name}" will delete their user credentials account. They will immediately lose server panel login permissions. Proceed?`)) {
        try {
          const response = await apiRequest(`/attendants/${id}`, 'DELETE');
          if (response.success) {
            showToast(response.message || 'Access revoked successfully.', 'success');
            loadAttendantsData();
          } else {
            throw new Error(response.message || 'Revocation failed');
          }
        } catch (err) {
          console.error(err);
          showToast(err.message || 'Operator deletion failed.', 'error');
        }
      }
    }
  </script>
</body>
</html>
