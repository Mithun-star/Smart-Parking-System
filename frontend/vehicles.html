<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles Registry - SmartPark Pro</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    
    <!-- Dynamic Topbar Navigation Container -->
    <div id="topbar-container"></div>

    <div class="container-fluid p-4">
      <div class="glass-panel p-4">
        
        <!-- Header Controls -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
          <div>
            <h5 class="fw-bold mb-1">Vehicles Look-up Registry</h5>
            <p class="text-secondary small mb-0">Browse and search historical vehicle details or edit registration cards.</p>
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#vehicleModal" onclick="openAddVehicleModal()">
            <i class="fas fa-plus me-2"></i>Add Vehicle Card
          </button>
        </div>

        <!-- Filter Row -->
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label">Search License Plate</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 border-secondary border-opacity-25 text-secondary"><i class="fas fa-search"></i></span>
              <input type="text" id="search-plate-input" class="form-control border-start-0 border-secondary border-opacity-25 text-uppercase" placeholder="e.g. DL3C...">
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Category Filter</label>
            <select id="search-type-filter" class="form-select">
              <option value="">All Categories</option>
              <option value="Four-Wheeler">Four-Wheeler</option>
              <option value="Two-Wheeler">Two-Wheeler</option>
              <option value="Heavy-Vehicle">Heavy-Vehicle</option>
            </select>
          </div>
        </div>

        <!-- Data Table Section -->
        <div class="table-responsive">
          <div id="vehicles-table-loader"></div>
          <table class="custom-table" id="vehicles-table">
            <thead>
              <tr>
                <th>License Plate</th>
                <th>Category</th>
                <th>Owner Name</th>
                <th>Owner Contact</th>
                <th>Registered Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="vehicles-table-body">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="custom-pagination">
          <span class="text-secondary small me-auto" id="pagination-info">Showing -- to -- of -- entries</span>
          <button class="page-btn" id="prev-page-btn" disabled><i class="fas fa-chevron-left"></i></button>
          <div id="page-numbers-container" class="d-flex gap-1"></div>
          <button class="page-btn" id="next-page-btn" disabled><i class="fas fa-chevron-right"></i></button>
        </div>

      </div>
    </div>
  </div>

  <!-- CRUD Vehicle Modal -->
  <div class="modal fade" id="vehicleModal" tabindex="-1" aria-labelledby="vehicleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-panel text-white" style="border: 1px solid var(--border-color); background-color: var(--bg-secondary);">
        <div class="modal-header border-bottom border-secondary border-opacity-15">
          <h5 class="modal-title fw-bold" id="vehicleModalLabel">Configure Vehicle Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="vehicle-crud-form">
          <input type="hidden" id="modal-vehicle-id">
          <div class="modal-body row g-3">
            
            <div class="col-md-6">
              <label for="modal-license-plate" class="form-label">License Plate <span class="text-danger">*</span></label>
              <input type="text" id="modal-license-plate" class="form-control text-uppercase" placeholder="e.g. DL3CAN1234" required>
            </div>

            <div class="col-md-6">
              <label for="modal-vehicle-type" class="form-label">Vehicle Category <span class="text-danger">*</span></label>
              <select id="modal-vehicle-type" class="form-select" required>
                <option value="Four-Wheeler">Four-Wheeler</option>
                <option value="Two-Wheeler">Two-Wheeler</option>
                <option value="Heavy-Vehicle">Heavy-Vehicle</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="modal-owner-name" class="form-label">Owner Full Name</label>
              <input type="text" id="modal-owner-name" class="form-control" placeholder="e.g. John Doe">
            </div>

            <div class="col-md-6">
              <label for="modal-owner-phone" class="form-label">Owner Contact Phone</label>
              <input type="text" id="modal-owner-phone" class="form-control" placeholder="e.g. +91 9999988888">
            </div>

          </div>
          <div class="modal-footer border-top border-secondary border-opacity-15">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Application Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    let allVehicles = [];
    let filteredVehicles = [];
    let currentUser = {};

    // Pagination
    let currentPage = 1;
    const entriesPerPage = 8;

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        currentUser = JSON.parse(localStorage.getItem('parking_user') || '{}');
        loadVehiclesData();
        setupFilters();
      }, 400);
    });

    async function loadVehiclesData() {
      const loader = document.getElementById('vehicles-table-loader');
      showLoader(loader);

      try {
        const response = await apiRequest('/vehicles');
        if (response.success) {
          allVehicles = response.data;
          applyFilters();
        }
      } catch (err) {
        console.error(err);
        showToast('Connection error fetching vehicle registers.', 'error');
      } finally {
        loader.innerHTML = '';
      }
    }

    function setupFilters() {
      const searchInput = document.getElementById('search-plate-input');
      const typeFilter = document.getElementById('search-type-filter');

      const triggerFilter = () => {
        currentPage = 1;
        applyFilters();
      };

      searchInput.addEventListener('input', triggerFilter);
      typeFilter.addEventListener('change', triggerFilter);

      document.getElementById('prev-page-btn').addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
        }
      });

      document.getElementById('next-page-btn').addEventListener('click', () => {
        const totalPages = Math.ceil(filteredVehicles.length / entriesPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          renderTable();
        }
      });
    }

    function applyFilters() {
      const term = document.getElementById('search-plate-input').value.trim().toLowerCase();
      const type = document.getElementById('search-type-filter').value;

      filteredVehicles = allVehicles.filter(v => {
        const matchPlate = v.license_plate.toLowerCase().includes(term);
        const matchType = !type || v.type === type;
        
        return matchPlate && matchType;
      });

      renderTable();
    }

    function renderTable() {
      const body = document.getElementById('vehicles-table-body');
      body.innerHTML = '';

      if (filteredVehicles.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-4">No registered vehicles on record.</td></tr>';
        updatePagination(0, 0, 0);
        return;
      }

      const totalItems = filteredVehicles.length;
      const totalPages = Math.ceil(totalItems / entriesPerPage);

      if (currentPage > totalPages) currentPage = totalPages || 1;

      const startIndex = (currentPage - 1) * entriesPerPage;
      const endIndex = Math.min(startIndex + entriesPerPage, totalItems);

      const pageEntries = filteredVehicles.slice(startIndex, endIndex);

      pageEntries.forEach(v => {
        const registeredDate = new Date(v.created_at).toLocaleDateString();

        let deleteBtn = '';
        if (currentUser.role === 'Admin') {
          deleteBtn = `
            <button onclick="deleteVehicle(${v.id})" class="btn btn-secondary btn-sm" title="Delete Register"><i class="fas fa-trash-alt text-danger"></i></button>
          `;
        }

        body.innerHTML += `
          <tr>
            <td class="fw-bold text-white">${v.license_plate}</td>
            <td>${v.type}</td>
            <td>${v.owner_name || '<span class="text-muted">Not Provided</span>'}</td>
            <td>${v.owner_phone || '<span class="text-muted">Not Provided</span>'}</td>
            <td>${registeredDate}</td>
            <td class="text-end">
              <button onclick="openEditVehicleModal(${v.id})" class="btn btn-secondary btn-sm me-1" data-bs-toggle="modal" data-bs-target="#vehicleModal" title="Edit Info"><i class="fas fa-edit text-info"></i></button>
              ${deleteBtn}
            </td>
          </tr>
        `;
      });

      updatePagination(startIndex + 1, endIndex, totalItems);
      renderPageNumbers(totalPages);
    }

    function updatePagination(start, end, total) {
      document.getElementById('pagination-info').innerText = `Showing ${start} to ${end} of ${total} entries`;
      document.getElementById('prev-page-btn').disabled = currentPage === 1;
      document.getElementById('next-page-btn').disabled = currentPage >= Math.ceil(total / entriesPerPage) || total === 0;
    }

    function renderPageNumbers(totalPages) {
      const container = document.getElementById('page-numbers-container');
      container.innerHTML = '';

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = `page-btn ${currentPage === i ? 'active' : ''}`;
        btn.innerText = i;
        btn.addEventListener('click', () => {
          currentPage = i;
          renderTable();
        });
        container.appendChild(btn);
      }
    }

    // Modal helpers
    function openAddVehicleModal() {
      document.getElementById('vehicleModalLabel').innerText = 'Add New Vehicle Entry Card';
      document.getElementById('vehicle-crud-form').reset();
      document.getElementById('modal-vehicle-id').value = '';
      document.getElementById('modal-license-plate').disabled = false;
    }

    function openEditVehicleModal(id) {
      document.getElementById('vehicleModalLabel').innerText = 'Edit Vehicle Card';
      const vehicle = allVehicles.find(v => v.id === id);
      if (!vehicle) return;

      document.getElementById('modal-vehicle-id').value = vehicle.id;
      document.getElementById('modal-license-plate').value = vehicle.license_plate;
      document.getElementById('modal-vehicle-type').value = vehicle.type;
      document.getElementById('modal-owner-name').value = vehicle.owner_name || '';
      document.getElementById('modal-owner-phone').value = vehicle.owner_phone || '';
      
      // Keep key unique during details updates
      document.getElementById('modal-license-plate').disabled = false;
    }

    // Form Submit
    document.getElementById('vehicle-crud-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('modal-vehicle-id').value;
      const license_plate = document.getElementById('modal-license-plate').value;
      const type = document.getElementById('modal-vehicle-type').value;
      const owner_name = document.getElementById('modal-owner-name').value;
      const owner_phone = document.getElementById('modal-owner-phone').value;

      try {
        let response;
        if (id) {
          response = await apiRequest(`/vehicles/${id}`, 'PUT', { license_plate, type, owner_name, owner_phone });
        } else {
          response = await apiRequest('/vehicles', 'POST', { license_plate, type, owner_name, owner_phone });
        }

        if (response.success) {
          showToast(response.message || 'Operation successful!', 'success');
          
          const modalInstance = bootstrap.Modal.getInstance(document.getElementById('vehicleModal'));
          modalInstance.hide();
          
          loadVehiclesData();
        } else {
          throw new Error(response.message || 'Action failed');
        }
      } catch (err) {
        console.error(err);
        showToast(err.message || 'API rejected details configuration.', 'error');
      }
    });

    // Delete details card
    async function deleteVehicle(id) {
      const v = allVehicles.find(item => item.id === id);
      if (!v) return;

      if (confirm(`CAUTION: Deleting vehicle registration for plate ${v.license_plate} will permanently erase all associated parking records. Proceed?`)) {
        try {
          const response = await apiRequest(`/vehicles/${id}`, 'DELETE');
          if (response.success) {
            showToast(response.message || 'Vehicle record deleted', 'success');
            loadVehiclesData();
          } else {
            throw new Error(response.message || 'Failed to delete');
          }
        } catch (err) {
          console.error(err);
          showToast(err.message || 'Vehicle deletion failed.', 'error');
        }
      }
    }
  </script>
</body>
</html>
